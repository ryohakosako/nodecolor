name: Deploy with Version and Changelog

on:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate site and changelog
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/build_site.py

      - name: Verify Pages files
        run: |
          test -s _site/index.html
          test -s _site/style.css
          for file in geometry legacy-model compat-v4 model assets storage export app; do
            test -s "_site/$file.js"
          done
          for file in app-info version changelog; do
            test -s "_site/$file.json"
          done
          test -s _site/changelog/index.html
          test -s _site/changelog/script.js
          test -s _site/changelog/style.css

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
