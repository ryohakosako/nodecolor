<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="OBJモデル・画像・照明をノードで配置して配色を検討するツール。"><title>ノードカラーシミュレーター</title><link rel="stylesheet" href="../style.css"><script defer src="../geometry.js"></script><script defer src="../legacy-model.js"></script><script defer src="../model.js"></script><script defer src="../assets.js"></script><script>const SceneStore={load:async()=>null,save:async()=>{}};</script><script defer src="../export.js"></script><script defer src="../app.js"></script></head>
<body>
<header class="toolbar"><button data-add="base" class="primary">＋ 固有色</button><button data-add="lighting">＋ 照明</button><button data-add="image">＋ 画像</button><div class="spacer"></div><span id="save-status" role="status">読み込み中…</span><button id="save-image">ノードを画像保存</button><button id="export">JSONを書き出す</button><button id="import">読み込む</button><input id="file" type="file" accept=".json,application/json" hidden></header>
<main id="canvas" tabindex="0" aria-label="ノードキャンバス"><div id="world"><svg id="wires" aria-label="接続線"></svg><div id="nodes"></div></div><div class="canvas-top"><span id="connection-status" role="status">出力端子をドラッグして接続</span><button id="cancel-wire" hidden>中止</button></div><div class="canvas-controls"><button id="zoom-out" aria-label="縮小">−</button><output id="zoom-label">100%</output><button id="zoom-in" aria-label="拡大">＋</button><button id="fit">全体表示</button><span id="node-count"></span></div><span class="pan-hint">余白：移動 · ホイール：拡大縮小 · オブジェクトをドラッグ：回転 · Esc：中止</span></main>
<dialog id="png-dialog"><p>PNGの出力サイズ</p><label>倍率 <input id="png-scale" type="number" min="0.25" max="4" step="0.25" value="1"></label><p id="png-size" role="status"></p><div><button id="png-cancel">キャンセル</button><button id="png-save">PNGを保存</button></div></dialog><dialog id="confirm-dialog"><p id="confirm-message"></p><div><button id="confirm-no">キャンセル</button><button id="confirm-yes" class="primary">読み込む</button></div></dialog><div id="toast" role="status" aria-live="polite"></div>
<pre id="qa" style="position:fixed;inset:50px 0 auto;background:#111;z-index:9999;pointer-events:none"></pre><script>
window.addEventListener('load',async()=>{const lines=[],check=(ok,label)=>{if(!ok)throw Error(label);lines.push('PASS '+label);document.querySelector('#qa').textContent=lines.join('\n');};try{
await new Promise(r=>requestAnimationFrame(r));
check(document.querySelectorAll('.port.output').length===1&&document.querySelectorAll('.port.input').length===3,'照明端子1つ・複数接続');
const light=state.nodes[0].lights.key,base=state.nodes[1],before=M.hex(M.shader(state,base)([0,0,1]));
document.querySelector('[aria-label="照明・主光源・逆光"]').click();check(light.azimuth===180&&M.hex(M.shader(state,base)([0,0,1]))!==before,'逆光プリセットの即時反映');
const side=document.querySelector('[aria-label="照明・主光源の手前／奥"]');side.value='front';side.dispatchEvent(new Event('change'));check(M.direction(light)[2]>.99,'手前への切替');
const ball=document.querySelector('.direction-ball'),rect=ball.getBoundingClientRect();ball.setPointerCapture=()=>{};ball.dispatchEvent(new PointerEvent('pointerdown',{pointerId:1,button:0,clientX:rect.left+rect.width*.7,clientY:rect.top+rect.height*.3}));ball.dispatchEvent(new PointerEvent('pointerup',{pointerId:1}));check(M.direction(light)[0]>.3&&M.direction(light)[1]>.3,'球マーカーのドラッグ方向反映');
for(const c of document.querySelectorAll('.light-heading input')){c.checked=false;c.dispatchEvent(new Event('change'));}check(M.hex(M.shader(state,base)([0,0,1]))==='#000000','全ミュートの寄与ゼロ');
check(M.source(state,base,'background')===undefined,'背景ミュート');
const value=light.azimuth,checkbox=document.querySelector('.light-heading input');checkbox.checked=true;checkbox.dispatchEvent(new Event('change'));check(light.azimuth===value,'再オン時の値保持');
selectOutput('lighting','bundle');connect(base.id,'bundle');check(state.edges.filter(e=>e.to===base.id).length===1,'再接続で入力置換');
document.querySelector('#save-image').click();check(document.querySelector('#png-scale').value==='1','PNG既定倍率1');const input=document.querySelector('#png-scale'),size=document.querySelector('#png-size').textContent;input.value='2';input.dispatchEvent(new Event('input'));check(size!==document.querySelector('#png-size').textContent&&state.exportScale===2,'PNG倍率とサイズの即時更新');document.querySelector('#png-cancel').click();
check(M.validate(JSON.parse(JSON.stringify(state))).exportScale===2,'追加設定JSON往復');
const a=SceneExporter.measure(state,{cardFor,portPoint,scale:1}),b=SceneExporter.measure(state,{cardFor,portPoint,scale:2});check(b.width>=a.width&&a.cards.length===state.nodes.length,'全ノード・接続を含む出力範囲');
document.title='PASS UI検証';}catch(e){document.querySelector('#qa').textContent=lines.join('\n')+'\nFAIL '+e.stack;document.title='FAIL UI検証';}});
</script></body></html>
