<!doctype html><html lang="ja"><meta charset="utf-8"><title>ノードカラー ブラウザ検証</title><style>body{font:14px sans-serif;background:#17191e;color:#eee;padding:20px}#fixture{position:absolute;left:20px;top:450px;width:180px;height:160px;background:#24272f}#fixture canvas{display:block;width:100px;height:80px}#fixture input{width:120px}</style>
<h1>ブラウザ内の機能テスト</h1><p>生成したテスト画像・OBJのみを使用。編集アプリの保存データは変更しません。</p><pre id="results">実行中…</pre><div id="fixture"><span>PNG生成テスト</span><canvas width="100" height="80"></canvas><input type="text" value="#FF0000"></div>
<script src="../geometry.js"></script><script src="../legacy-model.js"></script><script src="../model.js"></script><script src="../assets.js"></script><script src="../storage.js"></script><script src="../export.js"></script>
<script>
(async()=>{
 const sorted=v=>Array.isArray(v)?v.map(sorted):v&&typeof v==='object'?Object.fromEntries(Object.keys(v).sort().map(k=>[k,sorted(v[k])])):v;
 const equal=(a,b)=>JSON.stringify(sorted(a))===JSON.stringify(sorted(b));
 const out=document.querySelector('#results'),lines=[],assert=(value,message)=>{if(!value)throw Error(message);},test=async(name,run)=>{try{await run();lines.push('PASS '+name);}catch(e){lines.push('FAIL '+name+': '+e.message);}out.textContent=lines.join('\n');};
 let src,asset;
 await test('画像Fileのデコードと透明部分の白合成',async()=>{const c=document.createElement('canvas');c.width=4;c.height=2;const x=c.getContext('2d');x.fillStyle='#FF0000';x.fillRect(0,0,2,2);x.fillStyle='#0000FF';x.fillRect(2,0,1,2);const blob=await new Promise(resolve=>c.toBlob(resolve));src=await SceneAssets.readImage(new File([blob],'fixture.png',{type:'image/png'}));const img=new Image();await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject;img.src=src;});const result=document.createElement('canvas');result.width=4;result.height=2;const ctx=result.getContext('2d');ctx.drawImage(img,0,0);assert(ctx.getImageData(0,0,1,1).data[0]===255,'赤が一致しない');assert(ctx.getImageData(2,0,1,1).data[2]===255,'青が一致しない');assert([...ctx.getImageData(3,0,1,1).data].every(v=>v===255),'透明背景が白になっていない');});
 await test('OBJ File読込と3D描画への色適用',async()=>{const text='v -1 -1 0\nv 1 -1 0\nv 0 1 0\nf 1 2 3';const loaded=await SceneAssets.readOBJ(new File([text],'triangle.obj',{type:'text/plain'}));asset=loaded.asset;assert(loaded.mesh.faceCount===1,'面数');const frame=Geometry.rasterize(loaded.mesh,64,64,{shade:()=>[1,0,0],background:[0,0,0]});assert(frame.data.some((v,i)=>i%4===0&&v===255),'赤い形状がない');});
 await test('画像・OBJ・保存HEXを含むJSON往復',async()=>{const scene=ColorModel.sample(),n=scene.nodes.find(n=>n.type==='base');n.obj=asset;n.shape='obj';n.savedColors=['#112233'];scene.nodes.find(n=>n.type==='image').src=src;const restored=ColorModel.validate(JSON.parse(JSON.stringify(scene)));assert(equal(restored,scene),'保存内容が変化');});
 await test('IndexedDBに画像・OBJを保存して復元（隔離ストア）',async()=>{const name='nodecolor-qa-'+Date.now(),store=SceneStore.createStore(name),scene=ColorModel.sample();scene.nodes.find(n=>n.type==='image').src=src;scene.nodes.find(n=>n.type==='base').obj=asset;try{assert(await store.save(scene)==='IndexedDB','IndexedDBへ保存できない');const loaded=await store.load();assert(JSON.stringify(loaded.value)===JSON.stringify(scene),'保存復元不一致');}finally{await store.close();indexedDB.deleteDatabase(name);localStorage.removeItem('nodecolor.qa.'+name);}});
 await test('ノード全体のPNG生成と画像画素の保持',async()=>{const card=document.querySelector('#fixture'),canvas=card.querySelector('canvas'),ctx=canvas.getContext('2d');ctx.fillStyle='#FF0000';ctx.fillRect(0,0,100,80);const scene={nodes:[{id:'fixture',x:20,y:450}],edges:[],view:{scale:1}};const png=await SceneExporter.createCanvas(scene,{cardFor:()=>card,portPoint:()=>null}),pixels=png.getContext('2d').getImageData(0,0,png.width,png.height).data;assert(pixels.some((v,i)=>i%4===0&&v===255&&pixels[i+1]===0&&pixels[i+2]===0),'赤画素が欠落');const blob=await new Promise(resolve=>png.toBlob(resolve,'image/png'));assert(blob&&blob.size>100&&blob.type==='image/png','PNG Blobが不正');assert(png.width>=180&&png.height>=160,'ノード全体が入っていない');});
 out.dataset.complete='true';out.dataset.failures=lines.filter(l=>l.startsWith('FAIL')).length;document.title=out.dataset.failures==='0'?'PASS ノードカラー検証':'FAIL ノードカラー検証';
})().catch(e=>{document.querySelector('#results').textContent='FAIL '+e.stack;});
</script></html>
